<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tap Game</title>
    
    <!-- Agora Web SDK -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        /* Version Sidebar Badge */
        .version-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #ff9800;
            color: #121212;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
            z-index: 1000;
        }

        /* Login Screen Styles */
        #login-screen {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        #login-btn {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #error-msg {
            color: #ff5252;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 15px;
        }

        /* Game Screen Styles */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        #player-welcome {
            font-size: 1rem;
            color: #4CAF50;
            font-weight: bold;
        }

        #logout-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Expanding Player List Dropdown */
        .player-dropdown {
            width: 100%;
            background: #1e1e1e;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .dropdown-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #161616;
            border-top: 1px solid #2a2a2a;
        }

        .player-dropdown.open .dropdown-content {
            max-height: 200px;
        }

        .player-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid #222;
        }

        .player-item:last-child {
            border-bottom: none;
        }

        .pfp {
            font-size: 1.2rem;
            background: #2a2a2a;
            padding: 4px 8px;
            border-radius: 50%;
        }

        /* Voice Call Control Panel */
        .voice-panel {
            width: 100%;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .voice-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .mic-off { background: #ff5252; color: white; }
        .mic-on { background: #4CAF50; color: white; }
        .speaker-off { background: #444; color: #aaa; }
        .speaker-on { background: #2196F3; color: white; }

        /* Activity Log Ticker */
        #activity-log {
            background: #1e1e1e;
            color: #b0bec5;
            font-size: 0.8rem;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Secret Action Notification Label */
        #secret-log {
            color: #ffeb3b;
            font-size: 0.8rem;
            margin-bottom: 15px;
            min-height: 20px;
            text-align: center;
            font-weight: bold;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 1.1rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .circle {
            aspect-ratio: 1;
            background-color: #333333;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .circle:active {
            transform: scale(0.95);
        }

        /* Private Bar Section */
        .private-section {
            width: 100%;
            background: #181818;
            padding: 15px;
            border-radius: 15px;
            box-sizing: border-box;
            border: 1px dashed #444;
        }

        .private-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }

        .private-circle {
            aspect-ratio: 1;
            background-color: #444;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .private-circle:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Noticeable Version Sidebar Badge -->
    <div class="version-badge">v1.1.2</div>

    <!-- Login Container -->
    <div id="login-screen">
        <h2>Player Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="usernameInput" placeholder="Sam, Manuel, Martha, Arthur">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password">
        </div>
        <button id="login-btn">Login & Join</button>
        <div id="error-msg"></div>
    </div>

    <!-- Game Container -->
    <div id="game-screen">
        <div class="top-bar">
            <div id="player-welcome"></div>
            <button id="logout-btn">Log Out</button>
        </div>

        <!-- Expanding Player List Component -->
        <div class="player-dropdown" id="playerDropdown">
            <div class="dropdown-header" id="dropdownToggle">
              <span>👤 Connected Players</span>
              <span id="playerCount">(+0)</span>
            </div>
            <div class="dropdown-content" id="playerListContainer"></div>
        </div>

        <!-- Voice Chat Controls Panel -->
        <div class="voice-panel">
            <button id="mic-btn" class="voice-btn mic-off">🎤 Mic: OFF</button>
            <button id="speaker-btn" class="voice-btn speaker-off">🔊 Speaker: OFF</button>
        </div>

        <!-- Activity Log Box -->
        <div id="activity-log">Waiting for actions...</div>

        <!-- Secret Action Label -->
        <div id="secret-log"></div>

        <h2>Shared Circles</h2>
        <div class="grid" id="grid"></div>

        <!-- Private Local Bar Section -->
        <div class="private-section">
            <h2>Private Bar (Server Saved)</h2>
            <div class="private-grid" id="privateGrid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            projectId: "tapgame-28bc3",
            databaseURL: "https://tapgame-28bc3-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const playerWelcome = document.getElementById('player-welcome');
        const logoutBtn = document.getElementById('logout-btn');
        
        const dropdownToggle = document.getElementById('dropdownToggle');
        const playerDropdown = document.getElementById('playerDropdown');
        const playerCount = document.getElementById('playerCount');
        const playerListContainer = document.getElementById('playerListContainer');
        const activityLog = document.getElementById('activity-log');
        const secretLog = document.getElementById('secret-log');

        const micBtn = document.getElementById('mic-btn');
        const speakerBtn = document.getElementById('speaker-btn');

        const userProfiles = {
            "Sam": { pass: "X", pfp: "🐱" },
            "Manuel": { pass: "Y", pfp: "🐶" },
            "Martha": { pass: "Z", pfp: "🦊" },
            "Arthur": { pass: "A", pfp: "🦁" }
        };

        const savedUser = localStorage.getItem('tapGameUser');
        if (savedUser && userProfiles[savedUser]) {
            startApp(savedUser);
        }

        dropdownToggle.addEventListener('click', () => {
            playerDropdown.classList.toggle('open');
        });

        loginBtn.addEventListener('click', () => {
            const enteredUser = usernameInput.value.trim();
            const enteredPass = passwordInput.value.trim();

            if (userProfiles[enteredUser] && userProfiles[enteredUser].pass === enteredPass) {
                localStorage.setItem('tapGameUser', enteredUser);
                startApp(enteredUser);
            } else {
                errorMsg.textContent = "Invalid username or password!";
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('tapGameUser');
            window.location.reload();
        });

        function startApp(playerName) {
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            playerWelcome.textContent = `Hi, ${playerName}!`;

            const connectionsRef = ref(db, 'connections');
            const myConnectionRef = push(connectionsRef);

            set(myConnectionRef, { name: playerName });
            onDisconnect(myConnectionRef).remove();

            onValue(connectionsRef, (snapshot) => {
                const data = snapshot.val();
                playerListContainer.innerHTML = '';
                
                if (data) {
                    const activeUsers = Object.values(data);
                    playerCount.textContent = `(+${activeUsers.length})`;
                    
                    activeUsers.forEach(user => {
                        const pfpEmoji = userProfiles[user.name] ? userProfiles[user.name].pfp : "👤";
                        
                        const item = document.createElement('div');
                        item.classList.add('player-item');
                        item.innerHTML = `<span class="pfp">${pfpEmoji}</span> <span>${user.name}</span>`;
                        playerListContainer.appendChild(item);
                    });
                } else {
                    playerCount.textContent = `(+0)`;
                }
            });

            // Shared Circles & Activity Log Logic
            const circlesRef = ref(db, 'circles');
            const lastActionRef = ref(db, 'lastAction');
            const secretActionRef = ref(db, 'secretAction');
            
            const grid = document.getElementById('grid');
            const totalCircles = 8;
            const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0', '#FFA533', '#A533FF'];
            const circleElements = [];
            
            for (let i = 0; i < totalCircles; i++) {
                const circle = document.createElement('div');
                circle.classList.add('circle');
                
                circle.addEventListener('click', () => {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    set(ref(db, `circles/${i}`), randomColor);
                    set(lastActionRef, { player: playerName, color: randomColor });
                });

                grid.appendChild(circle);
                circleElements.push(circle);
            }

            onValue(circlesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    data.forEach((color, index) => {
                        if (color && circleElements[index]) {
                            circleElements[index].style.backgroundColor = color;
                        }
                    });
                }
            });

            onValue(lastActionRef, (snapshot) => {
                const action = snapshot.val();
                if (action) {
                    activityLog.textContent = `${action.player} changed color to ${action.color}`;
                }
            });

            // Private Bar Logic (Saved on Server per player)
            const privateGrid = document.getElementById('privateGrid');
            const totalPrivateCircles = 4;
            const privateCirclesRef = ref(db, `privateBars/${playerName}`);
            const privateCircleElements = [];
            
            for (let i = 0; i < totalPrivateCircles; i++) {
                const pCircle = document.createElement('div');
                pCircle.classList.add('private-circle');
                
                pCircle.addEventListener('click', () => {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    set(ref(db, `privateBars/${playerName}/${i}`), randomColor);
                    set(secretActionRef, {
                        player: playerName,
                        timestamp: Date.now()
                    });
                });

                privateGrid.appendChild(pCircle);
                privateCircleElements.push(pCircle);
            }

            onValue(privateCirclesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    data.forEach((color, index) => {
                        if (color && privateCircleElements[index]) {
                            privateCircleElements[index].style.backgroundColor = color;
                        }
                    });
                }
            });

            let secretTimeout;
            onValue(secretActionRef, (snapshot) => {
                const action = snapshot.val();
                if (action) {
                    secretLog.textContent = `${action.player} has changed color to a secret colour`;
                    clearTimeout(secretTimeout);
                    secretTimeout = setTimeout(() => {
                        secretLog.textContent = '';
                    }, 3000);
                }
            });

            // ==========================================
            // AGORA VOICE CHAT LOGIC (Joined-State Guard)
            // ==========================================
            const AGORA_APP_ID = "aea4e3b1469b4c739a24dbe6c66fbee1";
            const CHANNEL_NAME = "tapgame-voice-call";

            let agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            let localAudioTrack = null;
            let isMicActive = false;
            let isSpeakerActive = false;
            let isConnectedToAgora = false;

            // Handle incoming remote audio streams
            agoraClient.on("user-published", async (user, mediaType) => {
                await agoraClient.subscribe(user, mediaType);
                if (mediaType === "audio" && isSpeakerActive) {
                    user.audioTrack.play();
                }
            });

            // Join channel properly with async check
            async function initAgoraConnection() {
                try {
                    await agoraClient.join(AGORA_APP_ID, CHANNEL_NAME, null, null);
                    isConnectedToAgora = true;
                    console.log("Successfully joined Agora channel!");
                } catch (err) {
                    console.error("Agora join error: ", err);
                }
            }
            initAgoraConnection();

            // MIC BUTTON TOGGLE
            micBtn.addEventListener('click', async () => {
                if (!isConnectedToAgora) {
                    alert("Connecting to voice channel, please wait a second and try again.");
                    return;
                }

                if (!isMicActive) {
                    try {
                        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                        await agoraClient.publish(localAudioTrack);
                        
                        isMicActive = true;
                        micBtn.textContent = "🎤 Mic: ON";
                        micBtn.className = "voice-btn mic-on";
                    } catch (err) {
                        console.error("Mic error details:", err);
                        alert("Microphone permission denied or unavailable.");
                    }
                } else {
                    if (localAudioTrack) {
                        await agoraClient.unpublish(localAudioTrack);
                        localAudioTrack.close();
                        localAudioTrack = null;
                    }
                    isMicActive = false;
                    micBtn.textContent = "🎤 Mic: OFF";
                    micBtn.className = "voice-btn mic-off";
                }
            });

            // SPEAKER BUTTON TOGGLE
            speakerBtn.addEventListener('click', () => {
                isSpeakerActive = !isSpeakerActive;
                
                if (isSpeakerActive) {
                    speakerBtn.textContent = "🔊 Speaker: ON";
                    speakerBtn.className = "voice-btn speaker-on";
                    
                    agoraClient.remoteUsers.forEach(user => {
                        if (user.audioTrack) {
                            user.audioTrack.play();
                        }
                    });
                } else {
                    speakerBtn.textContent = "🔊 Speaker: OFF";
                    speakerBtn.className = "voice-btn speaker-off";
                    
                    agoraClient.remoteUsers.forEach(user => {
                        if (user.audioTrack) {
                            user.audioTrack.stop();
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
