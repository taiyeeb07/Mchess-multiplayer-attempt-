        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }
        .circle {
            aspect-ratio: 1;
            background-color: #333333;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        .circle:active { transform: scale(0.95); }
    </style>
</head>
