<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tap Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Login Screen Styles */
        #login-screen {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        #login-btn {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #error-msg {
            color: #ff5252;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 15px;
        }

        /* Game Screen Styles */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        #player-welcome {
            font-size: 1rem;
            color: #4CAF50;
            font-weight: bold;
        }

        #logout-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Expanding Player List Dropdown */
        .player-dropdown {
            width: 100%;
            background: #1e1e1e;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .dropdown-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #161616;
            border-top: 1px solid #2a2a2a;
        }

        .player-dropdown.open .dropdown-content {
            max-height: 200px;
        }

        .player-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid #222;
        }

        .player-item:last-child {
            border-bottom: none;
        }

        .pfp {
            font-size: 1.2rem;
            background: #2a2a2a;
            padding: 4px 8px;
            border-radius: 50%;
        }

        /* Activity Log Ticker */
        #activity-log {
            background: #1e1e1e;
            color: #b0bec5;
            font-size: 0.8rem;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        .circle {
            aspect-ratio: 1;
            background-color: #333333;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .circle:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Login Container -->
    <div id="login-screen">
        <h2>Player Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="usernameInput" placeholder="Sam, Manuel, Martha, Arthur">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password">
        </div>
        <button id="login-btn">Login & Join</button>
        <div id="error-msg"></div>
    </div>

    <!-- Game Container -->
    <div id="game-screen">
        <div class="top-bar">
            <div id="player-welcome"></div>
            <button id="logout-btn">Log Out</button>
        </div>

        <!-- Expanding Player List Component -->
        <div class="player-dropdown" id="playerDropdown">
            <div class="dropdown-header" id="dropdownToggle">
              <span>👤 Connected Players</span>
              <span id="playerCount">(+0)</span>
            </div>
            <div class="dropdown-content" id="playerListContainer"></div>
        </div>

        <!-- Activity Log Box -->
        <div id="activity-log">Waiting for actions...</div>

        <h2>Tap Any Circle!</h2>
        <div class="grid" id="grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            projectId: "tapgame-28bc3",
            databaseURL: "https://tapgame-28bc3-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const playerWelcome = document.getElementById('player-welcome');
        const logoutBtn = document.getElementById('logout-btn');
        
        const dropdownToggle = document.getElementById('dropdownToggle');
        const playerDropdown = document.getElementById('playerDropdown');
        const playerCount = document.getElementById('playerCount');
        const playerListContainer = document.getElementById('playerListContainer');
        const activityLog = document.getElementById('activity-log');

        const userProfiles = {
            "Sam": { pass: "X", pfp: "🐱" },
            "Manuel": { pass: "Y", pfp: "🐶" },
            "Martha": { pass: "Z", pfp: "🦊" },
            "Arthur": { pass: "A", pfp: "🦁" }
        };

        const savedUser = localStorage.getItem('tapGameUser');
        if (savedUser && userProfiles[savedUser]) {
            startApp(savedUser);
        }

        dropdownToggle.addEventListener('click', () => {
            playerDropdown.classList.toggle('open');
        });

        loginBtn.addEventListener('click', () => {
            const enteredUser = usernameInput.value.trim();
            const enteredPass = passwordInput.value.trim();

            if (userProfiles[enteredUser] && userProfiles[enteredUser].pass === enteredPass) {
                localStorage.setItem('tapGameUser', enteredUser);
                startApp(enteredUser);
            } else {
                errorMsg.textContent = "Invalid username or password!";
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('tapGameUser');
            window.location.reload();
        });

        function startApp(playerName) {
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            playerWelcome.textContent = `Hi, ${playerName}!`;

            const connectionsRef = ref(db, 'connections');
            const myConnectionRef = push(connectionsRef);

            set(myConnectionRef, { name: playerName });
            onDisconnect(myConnectionRef).remove();

            onValue(connectionsRef, (snapshot) => {
                const data = snapshot.val();
                playerListContainer.innerHTML = '';
                
                if (data) {
                    const activeUsers = Object.values(data);
                    playerCount.textContent = `(+${activeUsers.length})`;
                    
                    activeUsers.forEach(user => {
                        const pfpEmoji = userProfiles[user.name] ? userProfiles[user.name].pfp : "👤";
                        
                        const item = document.createElement('div');
                        item.classList.add('player-item');
                        item.innerHTML = `<span class="pfp">${pfpEmoji}</span> <span>${user.name}</span>`;
                        playerListContainer.appendChild(item);
                    });
                } else {
                    playerCount.textContent = `(+0)`;
                }
            });

            // Circle Grid & Activity Log Sync Logic
            const circlesRef = ref(db, 'circles');
            const lastActionRef = ref(db, 'lastAction');
            const grid = document.getElementById('grid');
            const totalCircles = 8;
            const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0', '#FFA533', '#A533FF'];
            const circleElements = [];
            
            for (let i = 0; i < totalCircles; i++) {
                const circle = document.createElement('div');
                circle.classList.add('circle');
                
                circle.addEventListener('click', () => {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Update circle state
                    set(ref(db, `circles/${i}`), randomColor);

                    // Broadcast who made the change and what hex color was picked
                    set(lastActionRef, {
                        player: playerName,
                        color: randomColor
                    });
                });

                grid.appendChild(circle);
                circleElements.push(circle);
            }

            // Listen for color changes on circles
            onValue(circlesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    data.forEach((color, index) => {
                        if (color && circleElements[index]) {
                            circleElements[index].style.backgroundColor = color;
                        }
                    });
                }
            });

            // Listen for the latest action ticker updates
            onValue(lastActionRef, (snapshot) => {
                const action = snapshot.val();
                if (action) {
                    activityLog.textContent = `${action.player} changed color to ${action.color}`;
                }
            });
        }
    </script>
</body>
</html>
