<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tap Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 1.2rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }

        .circle {
            aspect-ratio: 1;
            background-color: #333333;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .circle:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h2>Tap Any Circle!</h2>
    
    <div class="grid" id="grid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Public demo configuration for instant testing
        const firebaseConfig = {
            databaseURL: "https://tapgame-28bc3-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const circlesRef = ref(db, 'circles');

        const grid = document.getElementById('grid');
        const totalCircles = 8;
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0', '#FFA533', '#A533FF'];

        const circleElements = [];
        
        // 1. Generate the 8 circles dynamically
        for (let i = 0; i < totalCircles; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            
            // When clicked, pick a random color and save it to Firebase
            circle.addEventListener('click', () => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                set(ref(db, `circles/${i}`), randomColor);
            });

            grid.appendChild(circle);
            circleElements.push(circle);
        }

        // 2. Listen for color updates from any device in real-time
        onValue(circlesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                data.forEach((color, index) => {
                    if (color && circleElements[index]) {
                        circleElements[index].style.backgroundColor = color;
                    }
                });
            }
        });
    </script>
</body>
</html>
