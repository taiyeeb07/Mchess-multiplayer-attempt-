<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tap Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }

        .circle {
            aspect-ratio: 1;
            background-color: #333333;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .circle:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h2>Tap Any Circle!</h2>
    
    <div class="grid" id="grid">
        <!-- 8 Circles Generated Dynamically -->
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Free public test configuration
        const firebaseConfig = {
            databaseURL: "https://html-multiplayer-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const circlesRef = ref(db, 'circles');

        const grid = document.getElementById('grid');
        const totalCircles = 8;
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0', '#FFA533', '#A533FF'];

        // 1. Generate the 8 circles on the UI
        const circleElements = [];
        for (let i = 0; i < totalCircles; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            circle.dataset.index = i;
            
            // When touched/clicked, pick a random color and push to database
            circle.addEventListener('click', () => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                set(ref(db, `circles/${i}`), randomColor);
            });

            grid.appendChild(circle);
            circleElements.push(circle);
        }

        // 2. Listen for real-time updates from any player's device
        onValue(circlesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                data.forEach((color, index) => {
                    if (color && circleElements[index]) {
                        circleElements[index].style.backgroundColor = color;
                    }
                });
            }
        });
    </script>
</body>
</html>
